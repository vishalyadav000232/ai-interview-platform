name: Auth Service CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-auth-service:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vishal123
          POSTGRES_DB: auth_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d auth_test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7
        ports:
          - 6379:6379

    env:
      PYTHONPATH: services/auth-service
      DATABASE_URL: postgresql+asyncpg://postgres:vishal123@localhost:5432/auth_test_db
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test_secret_key
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      RESEND_API_KEY: test_key
      EMAIL_FROM: AI Interview <test@example.com>

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: services/auth-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        working-directory: services/auth-service
        run: |
          alembic upgrade head

      - name: Run tests
        working-directory: services/auth-service
        run: |
          pytest